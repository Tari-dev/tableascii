[project]
name = "tableascii"
version = "0.1.1"
description = "A lightweight, simple Python library to create clean ASCII Table."
readme = "README.md"
authors = [
    { name = "Tariq Muhammed", email = "tariqmuhammmad02@gmail.com" }
]
requires-python = ">=3.6"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://tari-dev.github.io/tableascii/"
Documentation = "https://tari-dev.github.io/tableascii/"
Source = "https://github.com/Tari-dev/tableascii"
"Bug Tracker" = "https://github.com/Tari-dev/tableascii/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools]
packages = ["tableascii"]
